<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="520" viewBox="0 0 1180 520">
<rect width="100%" height="100%" fill="#ffffff"/>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,"Noto Sans CJK SC",sans-serif;} .title{font-size:24px;font-weight:700;fill:#0f172a}.sub{font-size:13px;fill:#475569}.label{font-size:12px;fill:#334155}.small{font-size:11px;fill:#64748b}.value{font-size:12px;font-weight:600;fill:#0f172a}</style>
<text x="32" y="42" class="title">标的执行矩阵</text>
<text x="32" y="66" class="sub">先判断证据，再判断价格；市场表现只决定执行节奏，不构成买入理由。</text>
<rect x="32" y="79" width="1100" height="36" rx="6" fill="#f1f5f9"/>
<text x="40" y="105" class="value">Ticker</text>
<text x="160" y="105" class="value">方向</text>
<text x="350" y="105" class="value">动作</text>
<text x="920" y="105" class="value">当前标签</text>
<rect x="32" y="125" width="1100" height="34" fill="#ffffff"/>
<text x="40" y="150" class="label">SMTC</text>
<text x="160" y="150" class="label">光通信事件</text>
<text x="350" y="150" class="label">财报前不追；财报后看 beat/raise/margin/FCF</text>
<text x="920" y="150" class="label">高预期</text>
<rect x="32" y="167" width="1100" height="34" fill="#f8fafc"/>
<text x="40" y="192" class="label">MOD</text>
<text x="160" y="192" class="label">电力散热</text>
<text x="350" y="192" class="label">等待 Q4/FY2026，强确认后优先</text>
<text x="920" y="192" class="label">中性位置</text>
<rect x="32" y="209" width="1100" height="34" fill="#ffffff"/>
<text x="40" y="234" class="label">POWL</text>
<text x="160" y="234" class="label">电力电气</text>
<text x="350" y="234" class="label">事实强但不追，等订单兑现或回撤</text>
<text x="920" y="234" class="label">质量观察</text>
<rect x="32" y="251" width="1100" height="34" fill="#f8fafc"/>
<text x="40" y="276" class="label">FORM</text>
<text x="160" y="276" class="label">AP/HBM test</text>
<text x="350" y="276" class="label">等企稳，低于 EMA20 后看重新站回</text>
<text x="920" y="276" class="label">active watch</text>
<rect x="32" y="293" width="1100" height="34" fill="#ffffff"/>
<text x="40" y="318" class="label">VECO</text>
<text x="160" y="318" class="label">InP/设备</text>
<text x="350" y="318" class="label">订单强验证，等收入和毛利传导</text>
<text x="920" y="318" class="label">active watch</text>
<rect x="32" y="335" width="1100" height="34" fill="#f8fafc"/>
<text x="40" y="360" class="label">POET</text>
<text x="160" y="360" class="label">光通信期权</text>
<text x="350" y="360" class="label">只按里程碑小仓，等样品/量产/复购</text>
<text x="920" y="360" class="label">期权仓</text>
<rect x="32" y="377" width="1100" height="34" fill="#ffffff"/>
<text x="40" y="402" class="label">AXTI</text>
<text x="160" y="402" class="label">InP 材料</text>
<text x="350" y="402" class="label">位置过热，不追，等冷却和风险确认</text>
<text x="920" y="402" class="label">高波动</text>
<rect x="32" y="419" width="1100" height="34" fill="#f8fafc"/>
<text x="40" y="444" class="label">PPSI</text>
<text x="160" y="444" class="label">微型电力</text>
<text x="350" y="444" class="label">只观察订单转收入和现金流</text>
<text x="920" y="444" class="label">不追</text>
</svg>